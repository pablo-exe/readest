name: Build self-hosted Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-selfhosted-ipa

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_APP_PLATFORM: tauri
      NEXT_PUBLIC_SELF_HOSTED: 'true'
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare app assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Install Rust for Android
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/readest-app/src-tauri

      - name: Initialize Android project and generate production icons
        run: |
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          # Restore the Android project customizations tracked by this repo.
          git checkout -- .
          # Generate LAST: restoring tracked resources otherwise revives the
          # old adaptive/monochrome launcher configuration.
          pnpm tauri icon ../../data/icons/readest-book.png

      - name: Build installable ARM64 debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: pnpm --filter @readest/readest-app tauri android build --debug --apk --target aarch64

      - name: Validate and stage APK
        run: |
          APK="$(find apps/readest-app/src-tauri/gen/android/app/build/outputs/apk -type f -name '*-debug.apk' -print -quit)"
          test -n "$APK"
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep '^lib/arm64-v8a/' >/dev/null
          mkdir -p artifacts
          cp "$APK" artifacts/readest-android-selfhosted-arm64-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-android-selfhosted-arm64-debug
          path: artifacts/readest-android-selfhosted-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
