name: Validate existing iOS IPA

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing readest-ios-candidate-unvalidated (empty selects latest)
        required: false
        type: string
  push:
    branches:
      - codex/ios-selfhosted-ipa
    paths:
      - apps/readest-app/scripts/validate-ios-ipa.py
      - apps/readest-app/scripts/test_validate_ios_ipa.py
      - .github/workflows/ios-validate-candidate.yml

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run validator regression tests
        run: python3 -m unittest discover -s apps/readest-app/scripts -p test_validate_ios_ipa.py -v
      - name: Select retained candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_RUN: ${{ inputs.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPOSITORY']
          requested = os.environ.get('REQUESTED_RUN', '')
          endpoint = (f'actions/runs/{int(requested)}/artifacts' if requested else 'actions/artifacts?per_page=100')
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/{endpoint}', headers={
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'})
          artifacts = json.load(urllib.request.urlopen(request))['artifacts']
          candidates = [a for a in artifacts if a['name'] == 'readest-ios-candidate-unvalidated' and not a['expired']]
          if requested and not candidates:
              raise RuntimeError('Requested run has no retained candidate')
          if candidates:
              candidate = max(candidates, key=lambda a: a['created_at'])
              run_id = requested or str(candidate['workflow_run']['id'])
              print(f'Validating retained candidate from run {run_id}, artifact {candidate["id"]}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'run_id={run_id}\n')
          else:
              print('No retained candidate; regression tests passed. Full builds validate their own IPA.')
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.candidate.outputs.run_id != ''
        with:
          name: readest-ios-candidate-unvalidated
          path: candidate
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Validate retained IPA and all packaged icons
        if: steps.candidate.outputs.run_id != ''
        run: |
          python3 apps/readest-app/scripts/validate-ios-ipa.py \
            candidate/gen/apple/build/arm64/Readest.ipa candidate/icons/ios \
            --icon-preview verified-app-icon.png --diagnostics diagnostics
      - name: Preserve validation evidence
        if: always() && steps.candidate.outputs.run_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-ios-revalidation-evidence
          path: |
            verified-app-icon.png
            diagnostics/
          if-no-files-found: warn
          retention-days: 3
