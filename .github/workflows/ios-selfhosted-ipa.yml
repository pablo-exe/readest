name: Build self-hosted iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-selfhosted-ipa

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SELF_HOSTED: 'true'
      CARGO_HTTP_TIMEOUT: '180'
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Run IPA validator regression tests
        run: python3 -m unittest discover -s apps/readest-app/scripts -p test_validate_ios_ipa.py -v

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare app assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Install Rust for iOS
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Fetch locked Rust dependencies before Xcode build
        run: cargo fetch --locked --target aarch64-apple-ios

      - name: Generate production app icons
        run: pnpm tauri icon ../../data/icons/readest-book.png --ios-color '#fff'

      - name: Initialize Tauri iOS project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Apply production icons to the generated iOS catalog
        run: |
          test -d apps/readest-app/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset
          # On a fresh checkout the first icon run writes icons/ios. Init seeds
          # the Xcode catalog with Tauri's default logo, so replace it afterwards.
          pnpm tauri icon ../../data/icons/readest-book.png --ios-color '#fff'
          cmp apps/readest-app/src-tauri/icons/ios/AppIcon-60x60@2x.png \
            apps/readest-app/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/AppIcon-60x60@2x.png

      - name: Seed the generated iOS Info.plist
        run: cp apps/readest-app/src-tauri/Info-ios.plist apps/readest-app/src-tauri/gen/apple/Readest_iOS/Info.plist

      - name: Build unsigned IPA with self-hosted features
        run: pnpm tauri ios build --no-sign --ci

      - name: Preserve compiled candidate for independent validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-ios-candidate-unvalidated
          path: |
            apps/readest-app/src-tauri/gen/apple/build/arm64/Readest.ipa
            apps/readest-app/src-tauri/icons/ios/
            apps/readest-app/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
          if-no-files-found: error
          retention-days: 3

      - name: Validate installable IPA structure
        id: validate-ipa
        run: |
          python3 apps/readest-app/scripts/validate-ios-ipa.py \
            apps/readest-app/src-tauri/gen/apple/build/arm64/Readest.ipa \
            apps/readest-app/src-tauri/icons/ios \
            --icon-preview apps/readest-app/src-tauri/gen/apple/build/arm64/verified-app-icon.png \
            --diagnostics artifacts/ios-icon-diagnostics

      - name: Preserve icon diagnostics if validation fails
        if: failure() && steps.validate-ipa.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-ios-icon-diagnostics
          path: artifacts/ios-icon-diagnostics/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-ios-selfhosted-unsigned
          path: |
            apps/readest-app/src-tauri/gen/apple/build/arm64/Readest.ipa
            apps/readest-app/src-tauri/gen/apple/build/arm64/verified-app-icon.png
          if-no-files-found: error
          retention-days: 14
