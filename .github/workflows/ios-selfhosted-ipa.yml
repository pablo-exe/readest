name: Build self-hosted iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-selfhosted-ipa

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SELF_HOSTED: 'true'
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare app assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Install Rust for iOS
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios

      - name: Initialize Tauri iOS project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Seed the generated iOS Info.plist
        run: cp apps/readest-app/src-tauri/Info-ios.plist apps/readest-app/src-tauri/gen/apple/Readest_iOS/Info.plist

      - name: Build unsigned IPA with self-hosted features
        run: pnpm tauri ios build --no-sign --ci

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-ios-selfhosted-unsigned
          path: apps/readest-app/src-tauri/gen/apple/build/arm64/Readest.ipa
          if-no-files-found: error
          retention-days: 14
